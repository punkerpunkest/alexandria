<meta charset="utf-8">
<title>Alexandria spike</title>
<link rel="stylesheet" href="/app.css">
<main>
  <header>
    <span class="brand">Alexandria <em id="worldname">—</em></span>
    <span id="progress" class="progress"></span>
  </header>

  <div id="stage"><div id="ask">
    <h1>Ask for something you actually need to learn.</h1>
    <form id="askform">
      <input id="q" autofocus autocomplete="off" placeholder="Explain how a hash table handles collisions">
      <button>Teach me</button>
    </form>
    <p class="hint">No file, no curriculum. One question, one staged module.</p>
  </div></div>

  <footer>
    <button id="back">Back</button>
    <button id="next">Next</button>
    <span id="metrics" class="metrics"></span>
  </footer>
</main>
<script type="module" src="/app.js"></script>
