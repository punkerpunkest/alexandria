<!-- The closing screen, and the same template paints stage 0 before any article
     exists. In the scroller it is the last thing you reach; at stage 0 it is the only
     thing there, which is why it centres itself rather than sitting after content. -->
<section class="closing">
  <p class="closing-line" data-slot="ask_line"></p>
  <div class="closing-ask" data-slot="ask"></div>
</section>
